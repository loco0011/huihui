<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            overflow: hidden;
            position: relative;
        }

        /* Animated gradient background */
        .gradient-bg {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            background: linear-gradient(45deg, #ff006e, #8338ec, #3a86ff, #fb5607, #ff006e);
            background-size: 400% 400%;
            animation: gradientFlow 15s ease infinite;
            opacity: 0.15;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Particle canvas */
        #particles {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Prevent scroll on mobile */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        /* Modern glassmorphic card */
        .card {
            position: relative;
            width: 90%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px) saturate(150%);
            border-radius: 32px;
            padding: 48px 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 8px 32px 0 rgba(0, 0, 0, 0.37),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
            animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(30px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 32px;
            padding: 2px;
            background: linear-gradient(135deg, 
                rgba(255, 0, 110, 0.3),
                rgba(131, 56, 236, 0.3),
                rgba(58, 134, 255, 0.3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            animation: borderGlow 3s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        .question-box {
            text-align: center;
        }

        .emoji-container {
            font-size: 80px;
            margin-bottom: 24px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 30px rgba(255, 0, 110, 0.3));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff006e 0%, #8338ec 50%, #3a86ff 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            line-height: 1.2;
            animation: gradientShift 5s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            margin-bottom: 40px;
        }

        .button-group {
            display: flex;
            flex-direction: row;
            gap: 12px;
            position: relative;
            min-height: 140px;
            width: 100%;
        }

        .btn {
            padding: 18px 32px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            flex: 1;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 400px;
            height: 400px;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff006e 0%, #8338ec 100%);
            color: white;
            box-shadow: 
                0 10px 30px rgba(255, 0, 110, 0.3),
                0 1px 0 rgba(255, 255, 255, 0.2) inset;
            position: absolute;
            left: 0;
            top: 0;
            flex: 1;
            width: 48%;
            z-index: 5;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center;
        }

        .btn-yes:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 15px 40px rgba(255, 0, 110, 0.4),
                0 1px 0 rgba(255, 255, 255, 0.2) inset;
        }

        .btn-yes:active {
            transform: translateY(0);
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            position: absolute;
            right: 0;
            top: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex: 1;
            width: 48%;
            z-index: 10;
            transform-origin: center;
        }

        .btn-no.moving {
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn-no:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-no:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .toast {
            position: fixed;
            top: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            color: white;
            padding: 16px 32px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 500;
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: toastSlide 3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes toastSlide {
            0% {
                transform: translateX(-50%) translateY(-100px);
                opacity: 0;
            }
            10%, 90% {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateX(-50%) translateY(-100px);
                opacity: 0;
            }
        }

        .success-card {
            position: relative;
            width: 90%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px) saturate(150%);
            border-radius: 32px;
            padding: 56px 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 8px 32px 0 rgba(0, 0, 0, 0.37),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
            animation: successEntrance 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
        }

        @keyframes successEntrance {
            0% {
                opacity: 0;
                transform: scale(0.8) rotate(-5deg);
            }
            60% {
                transform: scale(1.05) rotate(2deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0);
            }
        }

        .success-emoji {
            font-size: 100px;
            margin-bottom: 24px;
            display: inline-block;
            animation: celebration 1s ease-in-out infinite;
        }

        @keyframes celebration {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-10deg) scale(1.1); }
            75% { transform: rotate(10deg) scale(1.1); }
        }

        .success-title {
            font-family: 'Playfair Display', serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
            font-size: 2.8rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .success-text {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.15rem;
            font-weight: 400;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .hidden {
            display: none !important;
        }

        @keyframes floatUp {
            0% {
                bottom: -50px;
                opacity: 0;
                transform: scale(0.5) rotate(0deg);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                bottom: 110vh;
                opacity: 0;
                transform: scale(1.2) rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .card, .success-card {
                padding: 36px 24px;
                margin: 16px;
                width: calc(100% - 32px);
            }

            .title {
                font-size: 1.8rem;
            }

            .subtitle {
                font-size: 0.85rem;
            }

            .emoji-container {
                font-size: 56px;
            }

            .btn {
                padding: 16px 20px;
                font-size: 0.9rem;
            }

            .btn-yes, .btn-no {
                width: 48%;
            }

            .button-group {
                min-height: 120px;
                gap: 8px;
            }

            .success-title {
                font-size: 2rem;
            }

            .success-emoji {
                font-size: 70px;
            }

            .success-text {
                font-size: 1rem;
            }
        }

        @media (max-width: 380px) {
            .card, .success-card {
                padding: 28px 20px;
            }

            .title {
                font-size: 1.5rem;
            }

            .btn {
                padding: 14px 16px;
                font-size: 0.85rem;
            }

            .button-group {
                min-height: 110px;
            }
        }
    </style>
</head>
<body>
    <div class="gradient-bg"></div>
    <canvas id="particles"></canvas>
    <div class="container">
        <div class="card question-box">
            <div class="emoji-container">💝</div>
            <h1 class="title">Do you Love Me Sohini?</h1>
            <p class="subtitle">Vebe chinte bol kintu!</p>
            
            <div class="button-group">
                <button class="btn btn-yes">Yes, Obviously!</button>
                <button class="btn btn-no">No😒</button>
            </div>
        </div>

        <div class="success-card hidden">
            <div class="success-emoji">🎉</div>
            <h1 class="success-title">Hihi<span style="font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;">😁</span> Ahhlaaabuuu tooo <span style="font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;">😘</span></h1>
        </div>
    </div>

    <script>
        // ===== EMOJI PARTICLE SYSTEM =====
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const emojiParticles = [];
        const emojiList = ['😍', '💕', '❤️', '💖', '😘', '🥰', '💝', '💗', '💓', '💞', '😻', '💋', '🌹', '✨', '💫'];
        const particleCount = 15;

        class EmojiParticle {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height;
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -50;
                this.emoji = emojiList[Math.floor(Math.random() * emojiList.length)];
                this.size = Math.random() * 20 + 25;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.speedY = Math.random() * 0.5 + 0.3;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = (Math.random() - 0.5) * 2;
                this.opacity = Math.random() * 0.3 + 0.15;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.rotation += this.rotationSpeed;

                if (this.y > canvas.height + 50) {
                    this.reset();
                }
                if (this.x < -50 || this.x > canvas.width + 50) {
                    this.x = Math.random() * canvas.width;
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.font = `${this.size}px Arial`;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.fillText(this.emoji, 0, 0);
                ctx.restore();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            emojiParticles.push(new EmojiParticle());
        }

        function animateEmojis() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            emojiParticles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            requestAnimationFrame(animateEmojis);
        }

        animateEmojis();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // ===== MAIN INTERACTION =====
        const yesBtn = document.querySelector('.btn-yes');
        const noBtn = document.querySelector('.btn-no');
        const questionBox = document.querySelector('.question-box');
        const successCard = document.querySelector('.success-card');
        const buttonGroup = document.querySelector('.button-group');

        let noBtnAttempts = 0;
        const noButtonTexts = ['No', 'Nope', 'Nah', 'Never', 'Maybe?', 'Sure?', 'Really?', 'Think!'];
        let lastMoveTime = 0;
        let yesScale = 1;

        function moveNoButton() {
            const now = Date.now();
            if (now - lastMoveTime < 200) return; // Prevent too frequent moves
            lastMoveTime = now;

            // Update text
            if (noBtnAttempts < noButtonTexts.length) {
                noBtn.textContent = noButtonTexts[noBtnAttempts];
                noBtnAttempts++;
            }

            // Grow Yes button
            yesScale += 0.08;
            yesBtn.style.transform = `scale(${yesScale})`;

            // Shrink No button
            const noScale = Math.max(0.6, 1 - (noBtnAttempts * 0.05));
            noBtn.style.transform = `scale(${noScale})`;

            // Get button group dimensions
            const container = buttonGroup.getBoundingClientRect();
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            
            // Calculate available space within the container
            const maxLeft = container.width - btnWidth - 10;
            const maxTop = container.height - btnHeight - 10;
            
            // Generate random position within bounds
            let randomLeft = Math.random() * Math.max(0, maxLeft);
            let randomTop = Math.random() * Math.max(0, maxTop);
            
            // Apply new position immediately (no transition to make it instant)
            noBtn.style.transition = 'none';
            noBtn.style.left = randomLeft + 'px';
            noBtn.style.top = randomTop + 'px';
            noBtn.style.right = 'auto';
            
            // Re-enable transition after a frame
            setTimeout(() => {
                noBtn.style.transition = 'all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1)';
            }, 10);
        }

        // Continuously check mouse position in the button area
        let checkInterval;
        buttonGroup.addEventListener('mouseenter', () => {
            checkInterval = setInterval(() => {
                const btnRect = noBtn.getBoundingClientRect();
                const mouseX = mousePos.x || 0;
                const mouseY = mousePos.y || 0;
                
                const buffer = 70;
                
                if (mouseX >= btnRect.left - buffer && 
                    mouseX <= btnRect.right + buffer &&
                    mouseY >= btnRect.top - buffer && 
                    mouseY <= btnRect.bottom + buffer) {
                    moveNoButton();
                }
            }, 30); // Check every 30ms for faster response
        });

        buttonGroup.addEventListener('mouseleave', () => {
            if (checkInterval) clearInterval(checkInterval);
        });

        // Track mouse position - make it more aggressive
        let mousePos = { x: 0, y: 0 };
        document.addEventListener('mousemove', (e) => {
            mousePos.x = e.clientX;
            mousePos.y = e.clientY;
            
            const btnRect = noBtn.getBoundingClientRect();
            const buffer = 60; // Larger buffer zone
            
            if (e.clientX >= btnRect.left - buffer && 
                e.clientX <= btnRect.right + buffer &&
                e.clientY >= btnRect.top - buffer && 
                e.clientY <= btnRect.bottom + buffer) {
                moveNoButton();
            }
        });

        // Prevent all click attempts
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            moveNoButton();
            return false;
        }, true);
        
        noBtn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            moveNoButton();
            return false;
        }, true);

        noBtn.addEventListener('mouseup', (e) => {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            return false;
        }, true);
        
        // For touch devices
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            moveNoButton();
            return false;
        }, true);

        noBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            return false;
        }, true);

        // Move on hover and any interaction attempt
        noBtn.addEventListener('mouseenter', (e) => {
            moveNoButton();
        });

        // Extra protection - pointer events
        noBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            moveNoButton();
            return false;
        }, true);

        noBtn.addEventListener('pointerup', (e) => {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            return false;
        }, true);

        // ===== YES BUTTON =====
        yesBtn.addEventListener('click', () => {
            questionBox.style.opacity = '0';
            questionBox.style.transform = 'scale(0.8)';
            
            setTimeout(() => {
                questionBox.classList.add('hidden');
                successCard.classList.remove('hidden');

                launchConfetti();
                setTimeout(() => launchHearts(), 500);
                setTimeout(() => launchFireworks(), 800);
            }, 500);
        });

        // ===== EFFECTS =====
        function launchConfetti() {
            const colors = ['#ff006e', '#8338ec', '#3a86ff', '#fb5607', '#ffd60a'];
            
            for (let i = 0; i < 150; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.style.cssText = `
                        position: fixed;
                        left: ${Math.random() * window.innerWidth}px;
                        top: -20px;
                        width: ${Math.random() * 10 + 5}px;
                        height: ${Math.random() * 10 + 5}px;
                        background: ${colors[Math.floor(Math.random() * colors.length)]};
                        border-radius: ${Math.random() > 0.5 ? '50%' : '0'};
                        z-index: 10000;
                        pointer-events: none;
                    `;
                    
                    document.body.appendChild(confetti);
                    
                    let posY = -20;
                    let rotation = 0;
                    const interval = setInterval(() => {
                        if (posY >= window.innerHeight) {
                            clearInterval(interval);
                            confetti.remove();
                        } else {
                            posY += Math.random() * 5 + 3;
                            rotation += Math.random() * 15;
                            confetti.style.top = posY + 'px';
                            confetti.style.transform = `rotate(${rotation}deg)`;
                            confetti.style.left = parseFloat(confetti.style.left) + (Math.random() - 0.5) * 3 + 'px';
                        }
                    }, 20);
                }, i * 15);
            }
        }

        function launchHearts() {
            const hearts = ['❤️', '💕', '💖', '💗', '💝', '💞'];
            for (let i = 0; i < 25; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.cssText = `
                        position: fixed;
                        left: ${Math.random() * window.innerWidth}px;
                        bottom: -50px;
                        font-size: ${Math.random() * 30 + 30}px;
                        z-index: 10000;
                        pointer-events: none;
                        animation: floatUp 4s ease-out forwards;
                    `;
                    
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 4000);
                }, i * 100);
            }
        }

        function launchFireworks() {
            for (let i = 0; i < 4; i++) {
                setTimeout(() => {
                    const x = Math.random() * window.innerWidth;
                    const y = Math.random() * window.innerHeight * 0.4 + 50;
                    
                    for (let j = 0; j < 32; j++) {
                        const spark = document.createElement('div');
                        spark.style.cssText = `
                            position: fixed;
                            left: ${x}px;
                            top: ${y}px;
                            width: 4px;
                            height: 4px;
                            background: hsl(${Math.random() * 360}, 100%, 60%);
                            border-radius: 50%;
                            z-index: 10000;
                            pointer-events: none;
                        `;
                        
                        document.body.appendChild(spark);
                        
                        const angle = (Math.PI * 2 * j) / 32;
                        const velocity = Math.random() * 4 + 2;
                        let posX = x, posY = y;
                        let velX = Math.cos(angle) * velocity;
                        let velY = Math.sin(angle) * velocity;
                        let life = 0;
                        
                        const animate = setInterval(() => {
                            life++;
                            if (life > 60) {
                                clearInterval(animate);
                                spark.remove();
                            } else {
                                posX += velX;
                                posY += velY;
                                velY += 0.15; // gravity
                                spark.style.left = posX + 'px';
                                spark.style.top = posY + 'px';
                                spark.style.opacity = (60 - life) / 60;
                            }
                        }, 16);
                    }
                }, i * 600);
            }
        }
    </script>
</body>
</html>
